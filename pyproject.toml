[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvbench"
version = "0.1.0"
description = "Open benchmark and ML toolkit for NV-diamond ODMR analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Eren Ari" }
]
keywords = ["nv-center", "diamond", "odmr", "quantum-sensing", "magnetometry", "machine-learning"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "typer>=0.9",
  "rich>=13.0",
  "pydantic>=2.0",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.8"
]
xgboost = ["xgboost>=2.0"]
torch = ["torch>=2.1"]
fits = ["astropy>=6.0"]
dashboard = ["streamlit>=1.32", "plotly>=5.18"]

[project.scripts]
nvbench = "nvbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
